name: Android Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Remove Termux-specific aapt2 override
        run: |
          cat android/gradle.properties
          sed -i '/android.aapt2FromMavenOverride/d' android/gradle.properties
          echo "--- After sed ---"
          cat android/gradle.properties

      - name: Write local.properties for CI
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Debug environment
        run: |
          {
            echo "## Environment"
            echo '```'
            echo "JAVA_HOME=$JAVA_HOME"
            java -version 2>&1
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "No platforms dir"
            ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "No build-tools dir"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_ENV"
          {
            echo "## Build Result"
            echo "Exit code: $EXIT_CODE"
            echo ""
            echo "### Last 200 lines of output:"
            echo '```'
            tail -200 /tmp/gradle-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Fail if build failed
        if: env.exit_code != '0'
        run: |
          echo "Build failed with exit code ${{ env.exit_code }}"
          exit 1

      - name: Upload debug APK
        if: env.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
