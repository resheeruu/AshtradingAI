name: Android Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Remove Termux-specific aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' android/gradle.properties

      - name: Write local.properties for CI
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Debug environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "No platforms"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "No build-tools"
          cat android/local.properties
          cat android/gradle.properties

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew clean assembleDebug --no-daemon 2>&1 | tee /tmp/gradle-output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $BUILD_EXIT"
            tail -100 /tmp/gradle-output.txt
          fi
          exit $BUILD_EXIT

      - name: Run lint
        if: success()
        working-directory: android
        run: ./gradlew lint --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
