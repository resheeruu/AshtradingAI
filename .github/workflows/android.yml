name: Android Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Remove Termux-specific aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' android/gradle.properties

      - name: Write local.properties for CI
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 > /tmp/gradle-output.txt || true
          echo "BUILD_EXIT=$?" >> /tmp/gradle-output.txt
          echo "--- ENVIRONMENT ---" >> /tmp/gradle-output.txt
          echo "JAVA_HOME=$JAVA_HOME" >> /tmp/gradle-output.txt
          echo "ANDROID_HOME=$ANDROID_HOME" >> /tmp/gradle-output.txt
          cat android/local.properties >> /tmp/gradle-output.txt
          cat android/gradle.properties >> /tmp/gradle-output.txt
          echo "--- FILES ---" >> /tmp/gradle-output.txt
          ls -la app/build/outputs/apk/debug/ 2>/dev/null >> /tmp/gradle-output.txt || echo "No APK output" >> /tmp/gradle-output.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/gradle-output.txt
          if-no-files-found: error
          retention-days: 5

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
